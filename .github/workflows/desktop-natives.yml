name: desktop-natives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-natives.yml"
      - "tools/core-sources.txt"
      - "tools/singbox-tags.txt"

permissions:
  contents: read

env:
  HEV_RELEASE: "2.18.0"
  TOR_BUNDLE: "14.5.1"
  ZEPTUN_RELEASE: "v1.1.1"

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3" }
      - run: ./tools/fetch-cores.sh vendor/xray-core reference/amneziawg-go reference/sing-openvpn
      - name: Build patched Xray with every protocol and collect cronet
        working-directory: vendor/xray-core
        run: |
          set -e
          mkdir -p out
          TAGS="$(paste -sd, "$GITHUB_WORKSPACE/tools/singbox-tags.txt"),with_purego"
          LDFLAGS="-checklinkname=0 -s -w -X runtime.godebugDefault=multipathtcp=0,tlssha1=1"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" -o out/xray-linux ./main
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" -o out/xray.exe   ./main
          go mod download github.com/sagernet/cronet-go/lib/linux_amd64 github.com/sagernet/cronet-go/lib/windows_amd64
          lin=$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)
          win=$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/windows_amd64)
          [ -n "$lin" ] && [ -n "$win" ] || { echo "::error::cronet modules did not resolve"; exit 1; }
          cp "$lin/libcronet.so"  out/
          cp "$win/libcronet.dll" out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: xray, path: "vendor/xray-core/out/*", retention-days: 30 }

  xray-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3" }
      - run: ./tools/fetch-cores.sh vendor/xray-core reference/amneziawg-go reference/sing-openvpn
      - name: Build patched Xray with every protocol, cronet linked in
        working-directory: vendor/xray-core
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CGO_CFLAGS: "-mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
        run: |
          set -e
          mkdir -p out
          TAGS="$(paste -sd, "$GITHUB_WORKSPACE/tools/singbox-tags.txt")"
          CGO_ENABLED=1 go build -trimpath -tags "$TAGS" \
            -ldflags="-checklinkname=0 -s -w -X runtime.godebugDefault=multipathtcp=0,tlssha1=1" \
            -o "out/xray-macos-${{ matrix.arch }}" ./main
          file "out/xray-macos-${{ matrix.arch }}"
          minos=$(otool -l "out/xray-macos-${{ matrix.arch }}" | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="minos"{print $2; exit}')
          echo "minimum macOS: $minos"
          [ "$minos" = "12.0" ] || { echo "::error::xray needs macOS $minos, not 12.0; Macs on older systems could not start it"; exit 1; }
          "out/xray-macos-${{ matrix.arch }}" version | head -1
      - uses: actions/upload-artifact@v4
        with: { name: "xray-macos-${{ matrix.arch }}", path: "vendor/xray-core/out/*", retention-days: 30 }

  dns-tunnels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3" }
      - run: ./tools/fetch-cores.sh vendor/AndroidLibXrayLite reference/vaydns
      - name: Build zeddns
        run: |
          set -e
          mkdir -p out
          for t in "linux amd64 -linux" "windows amd64 -windows.exe" "darwin arm64 -macos-arm64" "darwin amd64 -macos-x86_64"; do
            set -- $t
            (cd vendor/AndroidLibXrayLite/zeddns && CGO_ENABLED=0 GOOS=$1 GOARCH=$2 \
              go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/out/zeddns$3" ./cmd/zeddns)
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: dns-tunnels, path: "out/zeddns*", retention-days: 30 }

  psiphon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3" }
      - run: ./tools/fetch-cores.sh reference/psiphon-tunnel-core
      - name: Build the Psiphon console client
        run: |
          set -e
          mkdir -p out
          for t in "linux amd64 -linux" "windows amd64 -windows.exe" "darwin arm64 -macos-arm64" "darwin amd64 -macos-x86_64"; do
            set -- $t
            (cd reference/psiphon-tunnel-core/ConsoleClient && CGO_ENABLED=0 GOOS=$1 GOARCH=$2 \
              go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/out/psiphon$3" .)
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: psiphon, path: "out/psiphon*", retention-days: 30 }

  tor:
    runs-on: ubuntu-latest
    steps:
      - name: Tor, lyrebird and Conjure from the official desktop bundles
        run: |
          set -e
          for pair in "linux-x86_64 tor-linux" "windows-x86_64 tor-windows" \
                      "macos-aarch64 tor-macos-arm64" "macos-x86_64 tor-macos-x86_64"; do
            set -- $pair
            rm -rf teb && mkdir teb
            curl -fsSL --retry 3 "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_BUNDLE}/tor-expert-bundle-$1-${TOR_BUNDLE}.tar.gz" | tar -xz -C teb
            mkdir -p "$2/pt"
            find teb/tor -maxdepth 1 -type f -exec cp {} "$2/" \;
            for pt in lyrebird lyrebird.exe conjure-client conjure-client.exe; do
              [ -f "teb/tor/pluggable_transports/$pt" ] && cp "teb/tor/pluggable_transports/$pt" "$2/pt/"
            done
            cp teb/data/geoip teb/data/geoip6 "$2/"
            ls "$2" | grep -q -E '^tor(\.exe)?$' || { echo "::error::$1 has no tor binary"; exit 1; }
            ls "$2/pt" | grep -q -E '^lyrebird(\.exe)?$' || { echo "::error::$1 has no lyrebird"; exit 1; }
            chmod +x "$2"/* "$2"/pt/* 2>/dev/null || true
            ls -lR "$2"
          done
      - uses: actions/upload-artifact@v4
        with: { name: tor-linux, path: "tor-linux/", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: tor-windows, path: "tor-windows/", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: tor-macos-arm64, path: "tor-macos-arm64/", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: tor-macos-x86_64, path: "tor-macos-x86_64/", retention-days: 30 }

  zeptun:
    runs-on: ubuntu-latest
    steps:
      - name: zeptun for Windows and macOS from its own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dl windows macos
          gh release download "$ZEPTUN_RELEASE" --repo Noisemux/zeptun --dir dl --clobber \
            --pattern 'zeptun-windows-x86_64.zip' --pattern 'zeptun-darwin-universal' --pattern 'SHA256SUMS'
          ( cd dl && grep -E ' (zeptun-windows-x86_64\.zip|zeptun-darwin-universal)$' SHA256SUMS | sha256sum -c - )
          unzip -q -o dl/zeptun-windows-x86_64.zip -d dl/win
          for f in zeptun.exe wintun.dll wintun-LICENSE.txt; do
            src=$(find dl/win -type f -name "$f" | head -1)
            [ -n "$src" ] || { echo "::error::$f is missing from the zeptun Windows release"; exit 1; }
            cp "$src" "windows/$f"
          done
          cp dl/zeptun-darwin-universal macos/zeptun
          chmod +x macos/zeptun
          ls -l windows macos
      - uses: actions/upload-artifact@v4
        with: { name: zeptun-windows, path: "windows/*", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: zeptun-macos, path: "macos/*", retention-days: 30 }

  openconnect-windows:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - name: Install the MinGW toolchain and libraries
        run: |
          dnf -y -q install git curl unzip findutils make autoconf automake libtool gettext-devel pkgconf-pkg-config \
            mingw64-filesystem mingw64-gcc mingw64-binutils mingw64-gnutls mingw64-libxml2 mingw64-zlib mingw64-lz4 \
            mingw64-gettext mingw64-p11-kit
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && ./tools/fetch-cores.sh reference/openconnect
      - name: Cross-compile OpenConnect for Windows with MinGW
        working-directory: reference/openconnect
        run: |
          set -e
          ./autogen.sh
          mingw64-configure --without-gnutls-version-check --with-vpnc-script=vpnc-script-win.js
          make -j"$(nproc)" openconnect.exe
          out="$GITHUB_WORKSPACE/openconnect-windows"
          mkdir -p "$out"
          cp .libs/openconnect.exe "$out/" 2>/dev/null || cp openconnect.exe "$out/"
          cp .libs/libopenconnect-*.dll "$out/" 2>/dev/null || true
          sysroot=/usr/x86_64-w64-mingw32/sys-root/mingw/bin
          queue="$out/openconnect.exe $(ls "$out"/*.dll 2>/dev/null || true)"
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              for dll in $(x86_64-w64-mingw32-objdump -p "$f" | awk '/DLL Name:/ {print $3}'); do
                src="$sysroot/$dll"
                if [ -f "$src" ] && [ ! -f "$out/$dll" ]; then cp "$src" "$out/"; next="$next $out/$dll"; fi
              done
            done
            queue="$next"
          done
          curl -fsSL --retry 3 https://www.wintun.net/builds/wintun-0.14.1.zip -o /tmp/wintun.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  /tmp/wintun.zip" | sha256sum -c
          unzip -o -j -d "$out" /tmp/wintun.zip wintun/bin/amd64/wintun.dll
          curl -fsSL --retry 3 https://gitlab.com/openconnect/vpnc-scripts/raw/master/vpnc-script-win.js -o "$out/vpnc-script-win.js"
          grep -q "WScript" "$out/vpnc-script-win.js" || { echo "::error::vpnc-script-win.js did not download"; exit 1; }
          cp COPYING.LGPL "$out/openconnect-LICENSE.txt"
          ( cd "$out" && ls -1 | grep -v '^files.txt$' | sort > files.txt && cat files.txt )
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with: { name: openconnect-windows, path: "openconnect-windows/", retention-days: 30 }

  hev:
    runs-on: ubuntu-latest
    steps:
      - name: Take hev-socks5-tunnel from its own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p linux windows macos
          gh release download "$HEV_RELEASE" --repo heiher/hev-socks5-tunnel \
            --pattern "hev-socks5-tunnel-linux-x86_64" --output linux/hev-socks5-tunnel --clobber
          gh release download "$HEV_RELEASE" --repo heiher/hev-socks5-tunnel \
            --pattern "hev-socks5-tunnel-win64.zip" --output win64.zip --clobber
          unzip -q -o win64.zip -d win64
          for f in hev-socks5-tunnel.exe msys-2.0.dll wintun.dll; do
            src=$(find win64 -type f -name "$f" | head -1)
            [ -n "$src" ] || { echo "::error::$f is missing from the hev Windows release"; exit 1; }
            cp "$src" "windows/$f"
          done
          gh release download "$HEV_RELEASE" --repo heiher/hev-socks5-tunnel \
            --pattern "hev-socks5-tunnel-darwin-arm64" --output macos/hev-socks5-tunnel-arm64 --clobber
          gh release download "$HEV_RELEASE" --repo heiher/hev-socks5-tunnel \
            --pattern "hev-socks5-tunnel-darwin-x86_64" --output macos/hev-socks5-tunnel-x86_64 --clobber
          chmod +x linux/hev-socks5-tunnel macos/*
          ls -l linux windows macos
      - uses: actions/upload-artifact@v4
        with: { name: hev-linux, path: "linux/*", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: hev-windows, path: "windows/*", retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: hev-macos, path: "macos/*", retention-days: 30 }
