name: build-desktop-deb

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            pkg-config \
            libclang-dev \
            clang \
            cmake \
            zstd \
            binutils

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch base engines from official release
        run: |
          set -e
          dest=desktop/src/main/resources/bin/linux
          mkdir -p "$dest" /tmp/deb-extract
          curl -sSL "https://github.com/CluvexStudio/ZedSecure/releases/download/v3.1.3/ZedSecure-3.1.3-amd64.deb" -o /tmp/deb-extract/base.deb
          cd /tmp/deb-extract
          ar x base.deb
          tar --use-compress-program=unzstd -xf data.tar.zst || tar -xzf data.tar.gz || tar -xf data.tar.*

          # Copy all engines from base app jar/resources
          jar_file=$(find opt/zedsecure/lib/app -name "desktop-*.jar" | head -1)
          if [ -n "$jar_file" ]; then
            unzip -q "$jar_file" "bin/linux/*" -d /tmp/deb-extract/unpacked/ || true
            if [ -d "/tmp/deb-extract/unpacked/bin/linux" ]; then
              cp -r /tmp/deb-extract/unpacked/bin/linux/* "$GITHUB_WORKSPACE/$dest/"
            fi
          fi

          # Also check if binaries are directly in lib/ or bin/
          find opt/zedsecure -type f -name "xray" -exec cp {} "$GITHUB_WORKSPACE/$dest/xray" \; || true
          find opt/zedsecure -type f -name "hev-socks5-tunnel" -exec cp {} "$GITHUB_WORKSPACE/$dest/hev-socks5-tunnel" \; || true
          find opt/zedsecure -type f -name "zeddns" -exec cp {} "$GITHUB_WORKSPACE/$dest/zeddns" \; || true
          find opt/zedsecure -type f -name "psiphon" -exec cp {} "$GITHUB_WORKSPACE/$dest/psiphon" \; || true

          chmod +x "$GITHUB_WORKSPACE/$dest"/* || true
          ls -la "$GITHUB_WORKSPACE/$dest"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Clone Aether source & submodules
        run: |
          git clone --recurse-submodules https://github.com/CluvexStudio/Aether.git aether-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aether-src/aether"

      - name: Compile Aether binary
        working-directory: aether-src/aether
        run: |
          cargo build --release --locked --features tor --bin aether -j $(nproc)
          mkdir -p "$GITHUB_WORKSPACE/desktop/src/main/resources/bin/linux"
          cp target/release/aether "$GITHUB_WORKSPACE/desktop/src/main/resources/bin/linux/aether"
          chmod +x "$GITHUB_WORKSPACE/desktop/src/main/resources/bin/linux/aether"
          ls -la "$GITHUB_WORKSPACE/desktop/src/main/resources/bin/linux"

      - name: Build ZedSecure Deb & Distributable
        run: |
          ./gradlew --no-daemon :desktop:packageDeb :desktop:createDistributable

      - name: Collect and Enhance Output
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/deb/*.deb out/ || true

          # Inject bundled runtime bin/java and wrapper launcher into Deb
          deb_file=$(ls out/*.deb | head -1)
          if [ -n "$deb_file" ]; then
            mkdir -p /tmp/deb-patch/data /tmp/deb-patch/control
            cd /tmp/deb-patch
            ar x "$GITHUB_WORKSPACE/$deb_file"
            tar -xf control.tar.* -C control/
            tar -xf data.tar.* -C data/

            mkdir -p data/opt/zedsecure/lib/runtime/bin
            if [ ! -f data/opt/zedsecure/lib/runtime/bin/java ]; then
              cp "$JAVA_HOME/bin/java" data/opt/zedsecure/lib/runtime/bin/java
              chmod +x data/opt/zedsecure/lib/runtime/bin/java
            fi

            cat << "LAUNCHER" > data/opt/zedsecure/bin/zedsecure
#!/bin/sh
SCRIPT_DIR="$(dirname "$(readlink -f "$0")")"
APPDIR="$SCRIPT_DIR/../lib/app"
RUNTIME="$SCRIPT_DIR/../lib/runtime"

export _JAVA_AWT_WM_NONREPARENTING=1
export WAYLAND_DISPLAY="${WAYLAND_DISPLAY:-wayland-1}"
export DISPLAY="${DISPLAY:-:1}"

if [ -x "$RUNTIME/bin/java" ]; then
  JAVA_EXEC="$RUNTIME/bin/java"
elif command -v java >/dev/null 2>&1; then
  JAVA_EXEC="java"
else
  exec "$SCRIPT_DIR/ZedSecure" "$@"
fi

exec "$JAVA_EXEC" \
  -Dskiko.linux.autodetection=true \
  -Dskiko.vsync.enabled=false \
  -Djpackage.app-version=3.1.3 \
  -Dcompose.application.resources.dir="$APPDIR/resources" \
  -Dcompose.application.configure.swing.globals=true \
  -Dskiko.library.path="$APPDIR" \
  -cp "$APPDIR/*" \
  dev.cluvex.zedsecure.desktop.GuiKt "$@"
LAUNCHER
            chmod +x data/opt/zedsecure/bin/zedsecure
            mkdir -p data/usr/bin
            ln -sf /opt/zedsecure/bin/zedsecure data/usr/bin/zedsecure

            tar --use-compress-program=zstd -cf data.tar.zst -C data .
            tar -czf control.tar.gz -C control .
            ar rcs "$GITHUB_WORKSPACE/$deb_file" debian-binary control.tar.gz data.tar.zst
          fi

          ls -la "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: zedsecure-linux-deb
          path: out/*.deb
          retention-days: 30
