name: android-bundle

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'tools/get-cores.sh'
      - '.github/workflows/android-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version
        id: v
        run: |
          echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^zedsecure.versionCode=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh android

      - name: Unlock signing
        id: signing
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          STORE_PW="$PLAY_KEYSTORE_PASSWORD"
          KEY_PW="$PLAY_KEY_PASSWORD"
          ALIAS="$PLAY_KEY_ALIAS"
          if [ -n "$PLAY_KEYSTORE_BASE64" ]; then
            printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 -d > release.keystore || true
          fi
          if [ -s release.keystore ] && keytool -list -keystore release.keystore -storepass "$STORE_PW" >/dev/null 2>&1 && [ -n "$ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "mode=play" >> "$GITHUB_OUTPUT"
            echo "Using configured Play upload key."
          else
            echo "::warning::Play upload signing secrets are missing or invalid. Creating a temporary CI-only key so the AAB can still be built and tested. This artifact cannot be uploaded to Google Play as the production release."
            rm -f release.keystore
            STORE_PW="$(openssl rand -hex 18)"
            KEY_PW="$STORE_PW"
            ALIAS="ci-temporary"
            keytool -genkeypair -noprompt -keystore release.keystore -storetype JKS \
              -storepass "$STORE_PW" -keypass "$KEY_PW" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=ZX VPN CI Build, OU=CI, O=ZX VPN, L=CI, ST=CI, C=US"
            echo "mode=ci-only" >> "$GITHUB_OUTPUT"
          fi
          { echo "storeFile=release.keystore"; echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"; echo "keyAlias=$ALIAS"; } > keystore.properties

      - name: Build the bundle
        run: ./gradlew :app:bundleRelease

      - name: Check the bundle
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          src=app/build/outputs/bundle/release/app-release.aab
          [ -f "$src" ] || { echo "::error::$src was not built"; exit 1; }
          mkdir -p dist
          cp "$src" "dist/ZX-VPN-$V.aab"
          unzip -l "dist/ZX-VPN-$V.aab" | awk '/base\/lib\//{print $4}' | sort > libs.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libgojni libtor libobfs4proxy libconjure libsnowflake libsnispoof libhev-socks5-tunnel libopenconnect libzeptun libzeptun-jni; do
              grep -qx "base/lib/$abi/$lib.so" libs.txt || { echo "::error::$abi/$lib.so is not in the bundle"; exit 1; }
            done
          done
          grep -q "base/lib/x86/" libs.txt && { echo "::error::the bundle has x86 libraries without the engines"; exit 1; } || true
          echo "$(wc -l < libs.txt) native libraries in the bundle"
          "$JAVA_HOME/bin/jarsigner" -verify "dist/ZX-VPN-$V.aab" | tail -1
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "dist/ZX-VPN-$V.aab" | grep -E 'Owner|SHA256' | head -2
          ( cd dist && sha256sum ZX-VPN-*.aab > SHA256SUMS-aab.txt )
          ls -l dist

      - name: Forget the key
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || rm -f release.keystore keystore.properties

      - name: Mark CI-only bundle
        if: steps.signing.outputs.mode == 'ci-only'
        run: |
          echo "CI-only signing: not suitable for Google Play upload. Configure PLAY_KEYSTORE_BASE64, PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS and PLAY_KEY_PASSWORD for a Play-uploadable AAB." > dist/README-SIGNING.txt

      - uses: actions/upload-artifact@v7
        with: { name: "android-aab-${{ steps.v.outputs.name }}-${{ steps.v.outputs.code }}-${{ steps.signing.outputs.mode }}", path: dist/*, retention-days: 30 }
