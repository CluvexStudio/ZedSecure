name: npvs-decoder-test

on:
  push:
    branches: [test/npv-tunnel-support]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'tools/get-cores.sh'
      - '.github/workflows/npvs-decoder-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'tools/get-cores.sh'
      - '.github/workflows/npvs-decoder-test.yml'

permissions:
  contents: read

jobs:
  decoder-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare native engine dependency
        run: ./tools/get-cores.sh android

      - name: Run shared parser tests
        run: ./gradlew :shared:desktopTest

      - name: Run Android unit tests
        run: ./gradlew --warning-mode all :app:testDebugUnitTest
