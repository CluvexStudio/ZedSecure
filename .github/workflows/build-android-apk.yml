name: build-android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            pkg-config \
            libclang-dev \
            clang \
            cmake \
            unzip

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Fetch base libraries from official release APKs
        run: |
          set -e
          mkdir -p /tmp/base-apk app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          cd /tmp/base-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            curl -sSL "https://github.com/CluvexStudio/ZedSecure/releases/download/v3.1.3/ZedSecure-3.1.3-${abi}.apk" -o "${abi}.apk"
            unzip -q "${abi}.apk" "lib/${abi}/*" -d . || true
            if [ -d "lib/${abi}" ]; then
              cp -r lib/${abi}/* "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}/"
            fi
          done
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/"*

      - name: Clone Aether source & submodules
        run: |
          git clone --recurse-submodules https://github.com/CluvexStudio/Aether.git aether-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aether-src/aether"

      - name: Compile Aether Android native libraries (16KB page-size aligned)
        working-directory: aether-src
        run: |
          set -e
          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          # 1. arm64-v8a
          echo "Building libaether for arm64-v8a..."
          env \
            ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" \
            ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384" \
            CC_aarch64_linux_android="$TOOLCHAIN/clang" \
            CXX_aarch64_linux_android="$TOOLCHAIN/clang++" \
            CFLAGS_aarch64_linux_android="--target=aarch64-linux-android24" \
            CXXFLAGS_aarch64_linux_android="--target=aarch64-linux-android24" \
            AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar" \
            BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android --sysroot=$SYSROOT" \
            cargo build --release --locked --features tor --manifest-path aether/Cargo.toml --target aarch64-linux-android --bin aether -j $(nproc)
          cp aether/target/aarch64-linux-android/release/aether "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libaether.so"

          # 2. armeabi-v7a
          echo "Building libaether for armeabi-v7a..."
          env \
            ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" \
            ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi24-clang" \
            CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384" \
            CC_armv7_linux_androideabi="$TOOLCHAIN/clang" \
            CXX_armv7_linux_androideabi="$TOOLCHAIN/clang++" \
            CFLAGS_armv7_linux_androideabi="--target=armv7a-linux-androideabi24" \
            CXXFLAGS_armv7_linux_androideabi="--target=armv7a-linux-androideabi24" \
            AR_armv7_linux_androideabi="$TOOLCHAIN/llvm-ar" \
            BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7-linux-androideabi --sysroot=$SYSROOT" \
            cargo build --release --locked --features tor --manifest-path aether/Cargo.toml --target armv7-linux-androideabi --bin aether -j $(nproc)
          cp aether/target/armv7-linux-androideabi/release/aether "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libaether.so"

          # 3. x86_64
          echo "Building libaether for x86_64..."
          env \
            ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" \
            ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android24-clang" \
            CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384" \
            CC_x86_64_linux_android="$TOOLCHAIN/clang" \
            CXX_x86_64_linux_android="$TOOLCHAIN/clang++" \
            CFLAGS_x86_64_linux_android="--target=x86_64-linux-android24" \
            CXXFLAGS_x86_64_linux_android="--target=x86_64-linux-android24" \
            AR_x86_64_linux_android="$TOOLCHAIN/llvm-ar" \
            BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android --sysroot=$SYSROOT" \
            cargo build --release --locked --features tor --manifest-path aether/Cargo.toml --target x86_64-linux-android --bin aether -j $(nproc)
          cp aether/target/x86_64-linux-android/release/aether "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libaether.so"

          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/"*

      - name: Build Android APKs
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out-apks
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} out-apks/ \;
          ls -la out-apks/

      - uses: actions/upload-artifact@v4
        with:
          name: zedsecure-android-apks
          path: out-apks/*.apk
          retention-days: 30
