name: desktop-release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux, arch: x86_64, deb: amd64, sums: SHA256SUMS-linux.txt, artifact: desktop-linux }
          - { runner: ubuntu-22.04-arm, target: linux-arm64, arch: aarch64, deb: arm64, sums: SHA256SUMS-linux-arm64.txt, artifact: desktop-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version
        id: v
        run: echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Tools for .rpm and .AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm fakeroot file desktop-file-utils
          mkdir -p "$HOME/.local/bin"
          curl -sSLo "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh ${{ matrix.target }}

      - name: Check the engines the desktop launches are all here
        run: |
          set -e
          dest=desktop/src/main/resources/bin/linux
          missing=
          for f in xray libcronet.so libzedscan.so hev-socks5-tunnel zeddns masterdns psiphon tor/files.txt tor/tor tor/pt/lyrebird tor/bridges_default.lst; do
            [ -e "$dest/$f" ] || missing="$missing $f"
          done
          [ -z "$missing" ] || { echo "::error::not bundled:$missing"; exit 1; }
          want=$([ "${{ matrix.arch }}" = aarch64 ] && echo aarch64 || echo x86-64)
          for f in xray libcronet.so libzedscan.so hev-socks5-tunnel zeddns masterdns psiphon tor/tor tor/pt/lyrebird; do
            file -L "$dest/$f" | grep -q "$want" || { echo "::error::$f is not a ${{ matrix.arch }} binary: $(file -L "$dest/$f")"; exit 1; }
          done
          for f in psiphon-client masterdns-client snispoof snowflake-client; do
            [ ! -e "$dest/$f" ] || { echo "::error::bundled but never launched: $f"; exit 1; }
          done

      - name: Build .deb, .rpm and the application directory
        run: ./gradlew --warning-mode all :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable

      - name: Assemble the release files
        id: pack
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/ZedSecure-$V-${{ matrix.deb }}.deb"
          cp desktop/build/compose/binaries/main/rpm/*.rpm "dist/ZedSecure-$V-${{ matrix.arch }}.rpm"

          APP=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -1)

          tar -C "$(dirname "$APP")" -czf "dist/ZedSecure-$V-linux-${{ matrix.arch }}.tar.gz" "$(basename "$APP")"

          rm -rf AppDir && mkdir -p AppDir/usr
          cp -a "$APP." AppDir/usr/
          BIN=$(find AppDir/usr/bin -maxdepth 1 -type f -executable | head -1)
          cp desktop/icons/zedsecure.png AppDir/zedsecure.png
          cat > AppDir/zedsecure.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=ZedSecure
          Exec=$(basename "$BIN")
          Icon=zedsecure
          StartupWMClass=zedsecure-ZedSecure
          Categories=Network;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE=\$(dirname "\$(readlink -f "\$0")")
          exec "\$HERE/usr/bin/$(basename "$BIN")" "\$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH=${{ matrix.arch }} APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --no-appstream AppDir "dist/ZedSecure-$V-${{ matrix.arch }}.AppImage"

          ( cd dist && sha256sum ZedSecure-* > ${{ matrix.sums }} )
          ls -lh dist

      - name: The AppImage and the tarball start
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          got=$(APPIMAGE_EXTRACT_AND_RUN=1 "dist/ZedSecure-$V-${{ matrix.arch }}.AppImage" --version)
          echo "AppImage: $got"
          [ "$got" = "ZedSecure $V" ]
          rm -rf /tmp/zs-tar && mkdir -p /tmp/zs-tar
          tar -xzf "dist/ZedSecure-$V-linux-${{ matrix.arch }}.tar.gz" -C /tmp/zs-tar
          bin=$(find /tmp/zs-tar -path '*/bin/*' -type f -perm -u+x | head -1)
          got=$("$bin" --version)
          echo "tar.gz: $got"
          [ "$got" = "ZedSecure $V" ]

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 14

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows, arch: x86_64, sums: SHA256SUMS-windows.txt, artifact: desktop-windows }
          - { runner: windows-11-arm, target: windows-arm64, arch: arm64, sums: SHA256SUMS-windows-arm64.txt, artifact: desktop-windows-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version
        id: v
        shell: bash
        run: echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        shell: bash
        run: ./tools/get-cores.sh ${{ matrix.target }}

      - name: Check the engines the desktop launches are all here
        shell: bash
        run: |
          set -e
          dest=desktop/src/main/resources/bin/windows
          missing=
          extra=$([ "${{ matrix.arch }}" = x86_64 ] && echo msys-2.0.dll || true)
          for f in xray.exe libcronet.dll zeptun.exe wintun.dll hev-socks5-tunnel.exe zeddns.exe masterdns.exe psiphon.exe openconnect/files.txt tor/files.txt tor/tor.exe tor/pt/lyrebird.exe tor/bridges_default.lst $extra; do
            [ -e "$dest/$f" ] || missing="$missing $f"
          done
          [ -z "$missing" ] || { echo "::error::not bundled:$missing"; exit 1; }
          for f in psiphon-client masterdns-client snispoof snowflake-client; do
            [ ! -e "$dest/$f" ] || { echo "::error::bundled but never launched: $f"; exit 1; }
          done

      - name: Build the installer and the portable build
        run: ./gradlew --warning-mode all :desktop:packageMsi :desktop:createDistributable

      - name: Assemble the release files
        shell: bash
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/ZedSecure-$V-${{ matrix.arch }}.msi"
          app=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -1)
          zip="dist/ZedSecure-$V-windows-${{ matrix.arch }}.zip"
          if command -v 7z >/dev/null 2>&1; then
            ( cd "$(dirname "$app")" && 7z a -tzip -mx=9 "$OLDPWD/$zip" "$(basename "$app")" >/dev/null )
          else
            jar --create --no-manifest --file "$zip" -C "$(dirname "$app")" "$(basename "$app")"
          fi
          ( cd dist && sha256sum ZedSecure-* > ${{ matrix.sums }} )
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 14

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-26-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version
        id: v
        run: echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh macos-${{ matrix.arch }}

      - name: Check the engines the desktop launches are all here
        run: |
          set -e
          dest=desktop/src/main/resources/bin/macos
          missing=
          for f in xray zeptun hev-socks5-tunnel zeddns masterdns psiphon tor/files.txt tor/tor tor/pt/lyrebird tor/bridges_default.lst; do
            [ -e "$dest/$f" ] || missing="$missing $f"
          done
          [ -z "$missing" ] || { echo "::error::not bundled:$missing"; exit 1; }
          for f in psiphon-client masterdns-client snispoof snowflake-client; do
            [ ! -e "$dest/$f" ] || { echo "::error::bundled but never launched: $f"; exit 1; }
          done

      - name: Build the disk image
        run: ./gradlew --warning-mode all :desktop:packageDmg

      - name: Assemble the release files
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          mkdir -p dist
          cp desktop/build/compose/binaries/main/dmg/*.dmg "dist/ZedSecure-$V-macos-${{ matrix.arch }}.dmg"
          ( cd dist && shasum -a 256 ZedSecure-* > "SHA256SUMS-macos-${{ matrix.arch }}.txt" )
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
