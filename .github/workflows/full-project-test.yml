name: full-project-test

on:
  push:
    branches:
      - test/npv-tunnel-support
    paths:
      - 'app/**'
      - 'shared/**'
      - 'desktop/**'
      - 'tools/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/full-project-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-project-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shared-tests:
    name: Shared module tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run shared multiplatform tests
        run: ./gradlew --no-daemon :shared:allTests

  android:
    name: Android tests, lint, and APK builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Fetch and checksum native Android engine artifacts
        run: ./tools/get-cores.sh android
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android debug lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APKs for configured ABIs
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Compile Android instrumentation test APK
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - name: Upload debug APKs
        uses: actions/upload-artifact@v6
        with:
          name: zxvpn-android-debug-apks
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zxvpn-android-test-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Fetch and checksum Linux native engine artifacts
        run: ./tools/get-cores.sh linux
      - name: Run desktop tests
        run: ./gradlew --no-daemon :desktop:test
      - name: Build desktop application
        run: ./gradlew --no-daemon :desktop:build
      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zxvpn-desktop-test-reports
          path: |
            desktop/build/reports/**
            desktop/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
