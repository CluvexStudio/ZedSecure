name: Aether integration

on:
  push:
    branches: [feat/aether-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Verify scripts and resources
        run: |
          bash -n tools/get-aether.sh tools/get-cores.sh
          python3 tools/test-aether-packaging.py
      - name: Get pinned Linux and Android cores
        run: |
          ./tools/get-cores.sh linux
          ./tools/get-cores.sh android
      - name: Aether CLI smoke check
        run: |
          desktop/src/main/resources/bin/linux/aether help > build/aether-help.txt
          grep -q -- --tls-verify build/aether-help.txt
          grep -q -- --quick-reconnect build/aether-help.txt
      - name: Compile both apps and test lifecycle and profile sharing
        run: ./gradlew --console=plain --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx6144m :desktop:test :app:assembleDebug
      - name: Upload test results and debug APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aether-validation
          path: |
            desktop/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
            build/aether-help.txt
          retention-days: 14


