name: aether-check

# Branch-only compile check for the Aether section. Deliberately NOT part
# of the release flow (release.yml): it only verifies the desktop JVM
# module compiles. Stock engines and releases are untouched.
on:
  push:
    branches: ["aether-section"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Compile desktop (JVM)
        run: ./gradlew :desktop:compileKotlin --no-daemon
