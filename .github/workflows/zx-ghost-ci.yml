name: ZX · GHOST Anti-DPI CI

on:
  push:
    branches: [ZX]
    paths:
      - "shared/**"
      - "app/**"
      - ".github/workflows/zx-ghost-ci.yml"
      - ".github/workflows/ghost-check.yml"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    branches: [ZX]
    paths:
      - "shared/**"
      - "app/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zx-ghost-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghost-structure:
    name: GHOST structure & symbols
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify GHOST core files
        shell: bash
        run: |
          set -euo pipefail
          echo "== GHOST file presence =="
          test -f shared/src/commonMain/kotlin/dev/cluvex/zedsecure/core/ghost/GhostEngine.kt
          test -f shared/src/commonMain/kotlin/dev/cluvex/zedsecure/core/ghost/GhostAutoTuner.kt
          test -f shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui/settings/GhostSettingsPage.kt
          test -f shared/src/commonMain/kotlin/dev/cluvex/zedsecure/domain/model/AppSettings.kt
          test -f shared/src/commonMain/kotlin/dev/cluvex/zedsecure/platform/NetworkKind.kt
          test -f shared/src/androidMain/kotlin/dev/cluvex/zedsecure/platform/NetworkKind.android.kt
          test -f shared/src/desktopMain/kotlin/dev/cluvex/zedsecure/platform/NetworkKind.desktop.kt
          test -f shared/src/commonMain/kotlin/dev/cluvex/zedsecure/core/VpnManager.kt
          echo "files OK"

      - name: Verify required symbols
        shell: bash
        run: |
          set -euo pipefail
          GE=shared/src/commonMain/kotlin/dev/cluvex/zedsecure/core/ghost/GhostEngine.kt
          GA=shared/src/commonMain/kotlin/dev/cluvex/zedsecure/core/ghost/GhostAutoTuner.kt
          AS=shared/src/commonMain/kotlin/dev/cluvex/zedsecure/domain/model/AppSettings.kt
          VM=shared/src/commonMain/kotlin/dev/cluvex/zedsecure/core/VpnManager.kt
          UI=shared/src/commonMain/kotlin/dev/cluvex/zedsecure/ui/settings/GhostSettingsPage.kt

          grep -q "object GhostEngine" "$GE"
          grep -q "onTunnelConnected" "$GE"
          grep -q "onTunnelDisconnected" "$GE"
          grep -q "effectiveSettings" "$GE"
          grep -q "autoMode" "$AS"
          grep -q "data class GhostSettings" "$AS"
          grep -q "GhostEngine.onTunnelConnected" "$VM"
          grep -q "GhostEngine.onTunnelDisconnected" "$VM"
          grep -q "object GhostAutoTuner" "$GA"
          grep -q "fun plan" "$GA"
          grep -q "currentNetwork" "$GA"
          grep -q "NetworkKind.Cellular" "$GA"
          grep -q "fun GhostSettingsPage" "$UI"
          grep -q "AUTO" "$UI"
          echo "symbols OK"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "### GHOST Anti-DPI surface"
            echo "- Tunnel-bound lifecycle (Connect → start / Disconnect → stop)"
            echo "- AUTO: Wi‑Fi / cellular / unknown plans"
            echo "- Cellular: stronger baseline noise + adaptive burst"
            echo "- VpnManager hooks (non-invasive to engines)"
            echo "- GhostSettingsPage + debug panel"
          } >> "$GITHUB_STEP_SUMMARY"

  compile-shared:
    name: Compile shared (Android)
    runs-on: ubuntu-24.04
    needs: ghost-structure
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile shared Kotlin Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:compileAndroidMain --stacktrace

  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    needs: compile-shared
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ZX

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Android engines (best effort)
        run: |
          if [ -x ./tools/get-cores.sh ]; then
            ./tools/get-cores.sh android || echo "get-cores skipped/failed – continue"
          else
            echo "no get-cores.sh"
          fi

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --warning-mode all :app:assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          V=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2 || echo "dev")
          found=0
          while IFS= read -r src; do
            base=$(basename "$src")
            cp "$src" "dist/ZX-VPN-$V-$base"
            found=1
          done < <(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "::warning::No APK produced"
            exit 0
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt || true)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ZX-GHOST-Debug-APKs
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14
