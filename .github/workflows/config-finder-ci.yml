name: config-finder-check

on:
  push:
    branches: [feat/config-finder-spec]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/config-finder-ci.yml'

permissions:
  contents: read

jobs:
  shared-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile shared code and run parser tests
        run: ./gradlew --no-daemon :shared:desktopTest
