name: ZXVPN
options:
  bundleIdPrefix: dev.zx
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ZXVPN:
    type: application
    platform: iOS
    sources:
      - path: ZXVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zx.vpn
        PRODUCT_NAME: ZXVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ZXVPN/ZXVPN.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZX VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: ZXTunnel
        embed: true
  ZXTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ZXTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zx.vpn.tunnel
        CODE_SIGN_ENTITLEMENTS: ZXTunnel/ZXTunnel.entitlements
    info:
      path: ZXTunnel/Info.plist
      properties:
        CFBundleDisplayName: ZX VPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
schemes:
  ZXVPN:
    build:
      targets:
        ZXVPN: all
